# traefik dynamic configuration

http:
  services:
    wikibase:
      loadBalancer:
        servers:
          - url: "http://wikibase:80"

    wdqs:
      loadBalancer:
        servers:
          - url: "http://wdqs:9999"

    wdqs-frontend:
      loadBalancer:
        servers:
          - url: "http://wdqs-frontend:80"

    quickstatements:
      loadBalancer:
        servers:
          - url: "http://quickstatements:80"

    ontodia:
      loadBalancer:
        servers:
          - url: "http://ontodia:80"

    opensearch:
      loadBalancer:
        servers:
          - url: "http://elasticsearch:9200"

  routers:
    wikibase-router:
      rule: 'Host(`{{ env "WIKIBASE_PUBLIC_HOST" }}`) && !PathPrefix(`/tools`)'
      service: wikibase

    wdqs-router:
      rule: 'Host(`{{ env "WDQS_PUBLIC_HOST" }}`) && PathPrefix(`/sparql`) && (Method(`GET`) || Method(`OPTIONS`) || Method(`POST`))'
      service: wdqs
      middlewares: [ wdqs-prefix, wdqs-headers, wdqs-rate-limit ]

    wdqs-frontend-router:
      rule: 'Host(`{{ env "WDQS_PUBLIC_HOST" }}`) && !PathPrefix(`/sparql`)'
      service: wdqs-frontend

    quickstatements-router:
      rule: 'Host(`{{ env "WIKIBASE_PUBLIC_HOST" }}`) && PathPrefix(`/tools/quickstatements`)'
      service: quickstatements
      middlewares: [ quickstatements-redirectregex, quickstatements-stripprefix ]

    ontodia-router:
      rule: 'Host(`{{ env "ONTODIA_PUBLIC_HOST" }}`)'
      service: ontodia

    # Read-only search API for external applications (DEUSE). Only _search, _count,
    # _msearch (GET/POST) and _mapping (GET) reach OpenSearch, which itself has no
    # access control.
    opensearch-router:
      rule: 'Host(`{{ env "WIKIBASE_PUBLIC_HOST" }}`) && ((PathRegexp(`^/opensearch/[^/]+/_(search|count|msearch)$`) && (Method(`GET`) || Method(`POST`))) || (PathRegexp(`^/opensearch/[^/]+/_mapping$`) && Method(`GET`)))'
      service: opensearch
      priority: 1000
      middlewares: [ opensearch-auth, opensearch-stripprefix ]

  middlewares:
    wdqs-prefix:
      addPrefix:
        prefix: /bigdata/namespace/wdq/

    wdqs-headers:
      headers:
        customResponseHeaders:
          VARY: Accept
          Access-Control-Allow-Origin: "*"
          Access-Control-Allow-Methods: "GET,OPTIONS,POST"
          Access-Control-Allow-Headers: "*"
        customRequestHeaders:
          X-BIGDATA-READ-ONLY: yes
          X-BIGDATA-MAX-QUERY-MILLIS: "300000"

    wdqs-rate-limit:
      rateLimit:
        burst: 30
        average: 60
        period: 1m

    quickstatements-redirectregex:
      redirectRegex:
        regex: /tools/quickstatements$
        replacement: /tools/quickstatements/
        permanent: true

    quickstatements-stripprefix:
      stripPrefix:
        prefixes: [ /tools/quickstatements ]

    # Users are in config/traefik-secrets/opensearch.htpasswd (not in git). Create with:
    #   docker run --rm httpd:alpine htpasswd -nbB <user> '<password>' > config/traefik-secrets/opensearch.htpasswd
    opensearch-auth:
      basicAuth:
        usersFile: /etc/traefik/secrets/opensearch.htpasswd

    opensearch-stripprefix:
      stripPrefix:
        prefixes: [ /opensearch ]

    # To also restrict by caller address, set the IP below and add opensearch-ipallow
    # as the first middleware of opensearch-router.
    # opensearch-ipallow:
    #   ipAllowList:
    #     sourceRange: [ "203.0.113.10/32" ]
