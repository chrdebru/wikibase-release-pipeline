<html>

<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <script type="text/javascript" src="./ontodia-full.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/react/15.6.2/react.js"></script>
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/15.6.2/react-dom.js"></script>

  <style type="text/css">
    html, body, #container {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
  </style>

  <script type="text/javascript">	  
	//<![CDATA[
					
	// Settings for the SITYS Wikibase, adapted from Ontodia.WikidataSettings.
	// Wikibase does not write rdf:type for items, so classes come from the SITYS
	// properties P1 ("instance of") and P2 ("subclass of").
	// The query service has no full-text index, so search uses a label filter.
	var WIKIBASE = 'http://wikiba.se/ontology#';
	sitysSettings = {
		...Ontodia.WikidataSettings,
		defaultPrefix:
			'PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n' +
			'PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\n' +
			'PREFIX owl: <http://www.w3.org/2002/07/owl#>\n' +
			'PREFIX wikibase: <' + WIKIBASE + '>\n' +
			'PREFIX wd: <https://sitys.rise.uliege.be/entity/>\n' +
			'PREFIX wdt: <https://sitys.rise.uliege.be/prop/direct/>\n\n',
		fullTextSearch: {
			prefix: '',
			queryPattern:
				'?inst rdfs:label ?searchLabel .\n' +
				'FILTER(CONTAINS(LCASE(STR(?searchLabel)), LCASE("${text}")))\n' +
				'BIND(0 AS ?score)\n',
		},
		classTreeQuery:
			'SELECT DISTINCT ?class ?label ?parent WHERE {\n' +
			'  { ?someInst wdt:P1 ?class } UNION { ?class wdt:P2 ?someParent } UNION { ?someChild wdt:P2 ?class }\n' +
			'  OPTIONAL { ?class rdfs:label ?label }\n' +
			'  OPTIONAL { ?class wdt:P2 ?parent }\n' +
			'}\n',
		linkTypesPattern:
			'?prop wikibase:directClaim ?link .\n' +
			'BIND(0 AS ?instcount)\n',
		linkTypesQuery:
			'SELECT DISTINCT ?link ?instcount ?label WHERE {\n' +
			'  ?prop wikibase:directClaim ?link .\n' +
			'  BIND(0 AS ?instcount)\n' +
			'  OPTIONAL { ?prop rdfs:label ?label }\n' +
			'}\n',
		linkTypesInfoQuery:
			'SELECT ?link ?label WHERE {\n' +
			'  VALUES(?link) {${ids}}\n' +
			'  OPTIONAL { ?prop wikibase:directClaim ?link . ?prop rdfs:label ?label }\n' +
			'}\n',
		elementInfoQuery:
			'CONSTRUCT {\n' +
			'  ?inst rdf:type ?class .\n' +
			'  ?inst rdfs:label ?label .\n' +
			'  ?inst ?propType ?propValue .\n' +
			'} WHERE {\n' +
			'  VALUES (?inst) {${ids}}\n' +
			'  OPTIONAL { ?inst wdt:P1 ?class }\n' +
			'  OPTIONAL { ?inst rdfs:label ?label }\n' +
			'  OPTIONAL {\n' +
			'    ${propertyConfigurations}\n' +
			'    FILTER (isLiteral(?propValue))\n' +
			'  }\n' +
			'}\n',
		// No images in SITYS: a pattern that never matches.
		imageQueryPattern: '?inst <urn:sitys:no-image> ?image .',
		filterTypePattern: '?inst wdt:P1 ?instType . ?instType wdt:P2* ?class .',
		filterAdditionalRestriction:
			'FILTER ISIRI(?inst)\n' +
			'BIND(STR(?inst) AS ?strInst)\n',
		filterElementInfoPattern:
			'OPTIONAL { ?inst wdt:P1 ?foundClass }\n' +
			'BIND(COALESCE(?foundClass, owl:Thing) AS ?class)\n' +
			'OPTIONAL { ?inst rdfs:label ?label }\n',
	};
	
    window.onload = function () {
        function onWorkspaceMounted(workspace) {
            if (!workspace) { return; }
            workspace.getModel().importLayout({        
                dataProvider: new Ontodia.SparqlDataProvider({
                    endpointUrl: 'https://query.sitys.rise.uliege.be/sparql',
                    queryMethod: Ontodia.SparqlQueryMethod.POST,
                }, sitysSettings)
            });
        }

        ReactDOM.render(
            React.createElement(Ontodia.Workspace, {
                ref: onWorkspaceMounted,
                languages: [
                    {code: 'fr', label: 'French'},
                    {code: 'en', label: 'English'},
                    {code: 'ru', label: 'Russian'},
                ],
                language: 'fr',
            }),
            document.getElementById('container')
        );
    }
    //]]>
  </script>
</head>

<body>
  <div id="container"></div>
</body>

</html>
